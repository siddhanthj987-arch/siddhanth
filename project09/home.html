<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Banned</title>
//banned//
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      padding: 20px;
    }

    .ban-box {
      width: 100%;
      max-width: 700px;
      background: white;
      border: 2px solid #111;
      border-radius: 16px;
      padding: 50px 35px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 15px;
      font-size: clamp(38px, 8vw, 70px);
      letter-spacing: -3px;
    }

    .reason {
      font-size: 20px;
      line-height: 1.6;
      color: #444;
      margin: 0 auto;
      max-width: 550px;
    }

    .signature {
      margin-top: 35px;
      font-size: 16px;
      color: #777;
    }

    .name {
      color: #111;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="ban-box">
    <div class="icon">🚫</div>

    <h1>WEBSITE BANNED</h1>

    <p class="reason">
      This website has been banned by Siddhanth Jain
      due to no reply from the owner.
    </p>

    <p class="signature">
      Decision issued by <span class="name">Siddhanth Jain</span>
    </p>
  </div>
</body>
</html>
